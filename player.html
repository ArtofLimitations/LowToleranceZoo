<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="Low Tolerance Zoo - A ZZT-style game and editor for the modern web.">
    <title>LTZ Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/modules/vanilla-picker.csp.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body oncontextmenu="event.preventDefault();">
    <h1>Player for Low Tolerance Zoo</h1>

    <div class="block" id="block" style="width: 1154px;">
        <canvas class="playCanvas" id="lowToleranceCanvas" tabindex='1'></canvas>
        <div class="dialog-box" id="dialog-box"></div>
        <div class="game-over-box" id="game-over-box"></div>
        <div class="pause-box" id="pause-box"></div>
    </div>
    <canvas id="exportedSpriteCanvas" width="32" height="32" style="margin-top: 20px;"></canvas>

    <script type="module" src="js/player.js"></script>
</body>

</html>
