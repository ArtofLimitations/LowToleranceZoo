<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTZ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/modules/vanilla-picker.csp.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <h1>☺</h1>

    <div class="block" id="block">
        <!-- Main Canvas -->
        <canvas class="lowToleranceCanvas dashed-grid-paper" id="lowToleranceCanvas" tabindex='1'
            oncontextmenu="event.preventDefault();"></canvas>
        <div class="lowToleranceToolbar" id="lowToleranceToolbar">
            <div class="overlay" id="overlay"></div>
            <span class="title"><span class="shades">┤</span>
                <span style="color:#b61717;">Low</span> Tolerance <span style="color:#1c6db9;">Zoo</span> <span
                    class="shades">├</span></span>
            <div class="fieldContainer">
                <div class="fieldRow">
                    <button class="material-symbols-outlined" id="spriteButton" title="Sprite Editor">edit</button><span class="fieldText">Sprite<br> Editor</span>&nbsp;
                    <button class="material-symbols-outlined" id="paletteButton" title="Color Palette">palette</button><span class="fieldText">Color</span>
                </div>
                <div class="fieldRow"><span class="valueBox" id="currentSprite">1</span><span class="imageBox"
                        id="currentSpriteImage"> </span><span class="fieldText">Current<br> Sprite</span></div>
                <div class="fieldRow"><span class="colorBox" id="colorBoxDark">D </span><button
                        class="material-symbols-outlined" id="swapButton" title="Swap colors">swap_horiz</button> <span
                        class="colorBox" id="colorBoxLight">L </span></div>
                <div class="fieldRow"><span class="divider">░░░░░░░░░░░░░░░░░░░░░░░░</span></div>
                <div class="fieldRow"><button class="material-symbols-outlined" id="layer3Button" title="Layer 3">visibility</button><span class="layerBox" id="layer3">Layer 3</span> </div>

                <div class="fieldRow"><button class="material-symbols-outlined" id="layer2Button" title="Layer 2">visibility</button><span class="layerBox" id="layer2">Layer 2</span> </div>

                <div class="fieldRow"><button class="material-symbols-outlined" id="layer1Button" title="Layer 1">visibility</button><span class="layerBox" id="layer1">Layer 1</span> </div>
                <div class="fieldRow"><span class="divider">░░░░░░░░░░░░░░░░░░░░░░░░</span></div>
                <div class="fieldRow">
                    <div class="container">
                        <div class="tabs">
                            <input type="radio" id="wall" name="tabs" checked="">
                            <label class="tab" for="wall">Wall</label>
                            <input type="radio" id="item" name="tabs">
                            <label class="tab" for="item">Item</label>
                            <input type="radio" id="break" name="tabs">
                            <label class="tab" for="break">Break</label>
                            <span class="glider"></span>
                        </div>
                    </div><span class="fieldText">Sprite<br>Type</span>
                </div>
            </div>
        </div>
        <!----------------->
        <div class="spriteContainer" id="spriteContainer">
            <div class="spriteInfo" id="spriteInfo"><strong>Sprite Editor</strong><br> F: fill | D: draw | esc: save and
                close editor - <em><span class="spriteInfoMode">Mode:</span> <span id="spriteDrawMode">Draw</span></em>
            </div>
            <canvas class="spriteCanvas" id="spriteCanvas" width="584" height="520"></canvas>
        </div>
        <div class="paletteContainer" id="paletteContainer">
            <p><strong>Color Palette</strong></p>
            <div class="paletteColorContainer">
                <div class="paletteColorBox" id="colorDark"><span class="paletteLabel">Dark</span>

                </div>
                <div class="paletteColorBox" id="colorLight"><span class="paletteLabel">Light</span>
                </div>
            </div>
            <button class="paletteButton material-symbols-outlined" id="swapColorButton"
                title="Swap colors">swap_horiz</button><button
                class="paletteButton paletteButton-right material-symbols-outlined" id="blendRightButton"
                title="Blend right">join_right</button>
            <p>Recent Colors</p>
            <div class="paletteRecentContainer">
                <div class="paletteRecent" id="color1"></div>
                <div class="paletteRecent" id="color2"></div>
                <div class="paletteRecent" id="color3"></div>
                <div class="paletteRecent" id="color4"></div>
                <div class="paletteRecent" id="color5"></div>
            </div>
        </div>
        <div class="editorContainer" id="editorContainer">
            <p><strong>Script Editor</strong></p>
            <div class="editorTextContainer" id="editorTextContainer">
                <div class="fieldContainer"><input type="text" id="objectName" placeholder="Enter name"></div>
                <div class="textEditorContainer"><textarea id="objectTextEditor" placeholder="Code here..."
                        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
                </div>
            </div>
        </div>
    </div>
    <canvas id="exportedSpriteCanvas" width="32" height="32" style="margin-top: 20px;"></canvas>

    <!-- Controls for switching between modes and managing the sprite sheet -->
    <div id="controls">
        <button id="saveSpriteSheet">Save Sprite Sheet</button>
        <input type="file" id="loadSpriteSheet" accept=".json" style="display: none;">
        <button id="loadSpriteSheetButton">Load Sprite Sheet</button>
        <input type="file" id="fileInput" />
        <button id="loadFileButton">Load File</button>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
<!--  http-server ./ -c-1 -->

</html>
