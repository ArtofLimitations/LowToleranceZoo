<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Gradient</title>
</head>
<body>
  <canvas id="colorPicker" width="300" height="150"></canvas>
  <script>
const canvas = document.getElementById('colorPicker');
const ctx = canvas.getContext('2d');

// Define the gradient
const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);

// Add color stops for a smooth transition
gradient.addColorStop(0, "red");    // Start with red
gradient.addColorStop(0.2, "orange");
gradient.addColorStop(0.4, "yellow");
gradient.addColorStop(0.6, "green");
gradient.addColorStop(0.8, "blue");
gradient.addColorStop(1, "purple"); // End with purple

// Fill the canvas with the gradient
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, canvas.width, canvas.height);


  </script>
</body>
</html>
