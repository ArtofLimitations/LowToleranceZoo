<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Editor Example</title>
  <!-- Include CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <!-- Optional theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
</head>
<body>
  <h1>Code Editor Example</h1>
  <!-- Textarea for CodeMirror -->
  <textarea id="editor" name="editor"></textarea>

  <!-- Include CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <!-- Include CodeMirror mode for JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

  <script>
    // Initialize CodeMirror
    const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
      lineNumbers: true,          // Show line numbers
      mode: 'javascript',         // Syntax highlighting mode
      theme: 'dracula',           // Theme (optional)
      matchBrackets: true,        // Highlight matching brackets
      autoCloseBrackets: true,    // Auto-close brackets
    });

    // Set initial content
    editor.setValue("// Write your JavaScript code here\nconsole.log('Hello, World!');");
  </script>
</body>
</html>
