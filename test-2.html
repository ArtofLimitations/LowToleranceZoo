<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Text Highlighter</title>
  <style>
    .editor-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
    }

    .highlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: transparent;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow: hidden;
      background: none;
      pointer-events: none;
      z-index: 1;
      font-family: monospace;
    }

    .highlight-overlay span {
      background-color: rgb(134, 134, 30);
    }

    textarea {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 200px;
      font-family: monospace;
      resize: none;
    }
  </style>
</head>
<body>
  <div class="editor-container">
    <div class="highlight-overlay" id="highlight-overlay"></div>
    <textarea id="editor" placeholder="Type here..."></textarea>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const overlay = document.getElementById('highlight-overlay');

    // Words to highlight or quoted text
    const highlightRegex = /"(.*?)"|important|highlight/gi;

    // Synchronize textarea input and highlight overlay
    function updateHighlights() {
      const text = editor.value;

      // Replace matches with <span> wrapped content
      const highlightedText = text.replace(highlightRegex, (match) => {
        return `<span>${match}</span>`;
      });

      // Replace newlines for proper rendering in the overlay
      overlay.innerHTML = highlightedText.replace(/\n/g, '<br>');
    }

    // Synchronize scrolling between textarea and overlay
    editor.addEventListener('scroll', () => {
      overlay.scrollTop = editor.scrollTop;
      overlay.scrollLeft = editor.scrollLeft;
    });

    // Update highlights on input
    editor.addEventListener('input', updateHighlights);

    // Initialize with empty content
    updateHighlights();
  </script>
</body>
</html>
